# Netlify Configuration for efraterbaik (Catatan Keuangan)
# Pushes to GitHub will automatically trigger build & deployment on Netlify

[build]
  # For static deployment of index.html
  publish = "."

# SPA / Clean routing redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
